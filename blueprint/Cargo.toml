[package]
name = "blueprint-h2spec"
version = "0.0.1"
edition = "2021"
description = "yaws h2spec blueprint"
homepage = "https://github.com/yaws-rs/h2spec"
keywords = ["io", "uring", "epoll", "async"]
license = "Apache-2.0/MIT"
readme = "README.md"
repository = "https://github.com/yaws-rs/h2spec"
categories = ["science"]

[dependencies]
blueprint = { version = "0.2.0", default-features = false }
h2types = { path = "../h2types", version = "0.0.1", default-features = false }
h11types = { version = "0.0.4", default-features = false }
base64 = { version = "0.23", default-features = false }

[dev-dependencies]
insta = { version = "1.47" }
rstest = { version = "0.26" }
criterion = { version = "0.5" }

[features]
default = []
h2server = []
std = []

[package.metadata.docs.rs]
features = ["h2server"]
